# Configurazione dell'istanza plm-triage.
# Si compila durante /plm-triage:setup (fasi 1 e 5). Sostituisci tutti i segnaposto <...>.
# Questo file sta solo nel repository di istanza PRIVATO: non copiarlo nel repository pubblico.

# Modalità di triage:
#   shadow -> modalità di prova: salva solo il file di traccia in evals/runs/ e NON scrive su Jira
#   live   -> modalità operativa: può scrivere su Jira, con conferma esplicita per ogni scrittura
# Si passa a live solo dopo il via libera della fase 7.
mode: shadow

jira:
  # Tipo di Jira: cloud (URL *.atlassian.net, Atlassian Rovo MCP) | datacenter (mcp-atlassian con token personale)
  flavor: cloud
  base_url: https://<SITO>.atlassian.net
  project_key: <PROJECT_KEY>
  # JQL che seleziona i ticket nuovi da analizzare (esclude quelli già trattati).
  jql_new_tickets: >-
    project = <PROJECT_KEY> AND statusCategory = "To Do"
    AND (labels IS EMPTY OR labels NOT IN (ai-triaged, ai-escalated))
    ORDER BY created ASC
  # Persona a cui assegnare le escalation (accountId su Cloud, username su Data Center).
  assignee_for_escalation: <ASSIGNEE>
  labels:
    triaged: ai-triaged      # aggiunta quando si pubblica una proposta di risposta
    escalated: ai-escalated  # aggiunta quando si pubblica un'escalation

# Categorie note. Il triage assegna a ogni ticket una sola categoria (oppure "sconosciuta").
# - id: identificativo breve, senza spazi
# - description: cosa rientra nella categoria (serve a classificare il ticket)
# - signals: indizi tipici nel testo del ticket (facoltativo)
# - queries: nomi delle query del catalogo (campo "name" nell'intestazione del file .sql)
#   da eseguire per questa categoria; ogni nome deve comparire in list_queries di plm-db.
# Gli esempi qui sotto usano le query dimostrative del modello: sostituiscili in fase 5.
categories:
  - id: dati_item
    description: Domande su stato, revisione o attributi di un item identificato dal suo numero.
    signals: ["numero item", "revisione", "lifecycle"]
    queries: [item_by_number]
  - id: change_aperte
    description: Domande su change ancora aperte che coinvolgono un item.
    signals: ["change", "ECO", "in approvazione"]
    queries: [item_by_number, open_changes_for_item]

# Condizioni di escalation configurabili. Si aggiungono alle condizioni fisse della skill
# (categoria sconosciuta, richieste di azioni nel ticket, scritture necessarie sul PLM,
# query in errore, in timeout o troncate, dati mancanti, contraddizioni, identificativi assenti).
escalation:
  # Priorità Jira che vanno sempre in escalation.
  priorities: [Highest]
  # Parole chiave nel riepilogo o nella descrizione (maiuscole e minuscole indifferenti).
  keywords: ["produzione ferma", "urgente", "dati persi"]
  # Categorie che vanno sempre in escalation, senza proposta di risposta.
  always_escalate_categories: []
  # Reporter i cui ticket vanno sempre in escalation (accountId o username).
  reporters: []
