[project]
name = "plm-db-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing a catalog of named SQL queries against an Agile PLM database"
readme = { text = "Local stdio MCP server used by the plm-triage Claude Code plugin.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1,<3",
    "pymssql>=2.3.2",
    "pyyaml>=6.0",
    "keyring>=25.0",
]

[project.scripts]
plm-db-mcp = "plm_db_mcp.server:main"
plm-db = "plm_db_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plm_db_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
